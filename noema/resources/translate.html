<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Noema</title>
    <link rel="icon" href="data:," />
    <style>
      @font-face {
        font-family: Noema;
        src: url("/font.ttf");
      }
      :root {
        color-scheme: dark;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: #101114;
        color: #e4e7ec;
        font:
          16px/1.6 system-ui,
          sans-serif;
      }
      main {
        max-width: 1120px;
        margin: 7vh auto;
        padding: 24px;
      }
      h1 {
        font-size: 26px;
        font-weight: 500;
        margin: 0 0 28px;
      }
      .panes {
        display: grid;
        grid-template-columns: 1fr auto 1fr;
        gap: 20px;
        align-items: center;
      }
      .label {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 12px;
        gap: 8px;
      }
      select,
      button,
      textarea {
        font: inherit;
        color: inherit;
      }
      select {
        border: 1px solid #34363b;
        background: #181a1e;
        border-radius: 5px;
        padding: 6px 8px;
      }
      textarea {
        width: 100%;
        height: 330px;
        resize: vertical;
        border: 1px solid #34363b;
        border-radius: 8px;
        background: #181a1e;
        padding: 20px;
        line-height: 1.8;
        font-size: 19px;
      }
      textarea::placeholder {
        color: #8d929c;
      }
      #noema {
        font-family: Noema, ui-monospace, monospace;
        font-size: 24px;
      }
      .arrows {
        display: grid;
        gap: 14px;
        padding-top: 42px;
      }
      button {
        border: 1px solid #454a53;
        border-radius: 6px;
        padding: 10px 16px;
        background: #2b3038;
        color: #f2f3f5;
        cursor: pointer;
      }
      button:hover:not(:disabled) {
        background: #3b424c;
      }
      button:disabled {
        opacity: 0.4;
        cursor: default;
      }
      :focus-visible {
        outline: 2px solid #99b8ff;
        outline-offset: 3px;
      }
      #status {
        min-height: 28px;
        margin: 20px 0 6px;
      }
      .error {
        color: #ffaaaa;
      }
      .note {
        font-size: 13px;
        color: #9b9fa8;
        margin: 0;
      }
      @media (max-width: 760px) {
        main {
          margin: 0 auto;
        }
        .panes {
          grid-template-columns: 1fr;
        }
        .arrows {
          display: flex;
          padding: 0;
          justify-content: center;
        }
        textarea {
          height: 230px;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Noema</h1>
      <div class="panes">
        <section>
          <div class="label">
            <label for="natural">日本語・英語</label
            ><select id="language" aria-label="自然言語">
              <option value="ja">日本語</option>
              <option value="en">English</option>
            </select>
          </div>
          <textarea id="natural" spellcheck="false" placeholder="例：犬が猫を追う"></textarea>
        </section>
        <div class="arrows">
          <button id="forward" aria-label="Noemaへ変換" disabled>→</button
          ><button id="backward" aria-label="日本語・英語へ変換" disabled>←</button>
        </div>
        <section>
          <div class="label">
            <label for="noema">Noema</label
            ><select id="script" aria-label="Noemaの表記">
              <option value="native">固有文字</option>
              <option value="proxy">代用表記</option>
            </select>
          </div>
          <textarea id="noema" spellcheck="false" placeholder="Noemaの文を入力"></textarea>
        </section>
      </div>
      <p id="status" role="status" aria-live="polite"></p>
      <p class="note">15概念の短い単文に対応する試作です。Noemaからの変換は定型文になります。</p>
    </main>
    <script>
      const $ = (id) => document.getElementById(id),
        alphabet = "abcdefghijklmnopqrstuvwxyz234567";
      let revision = 0,
        busy = false;
      function update() {
        revision++;
        $("forward").disabled = busy || !$("natural").value.trim();
        $("backward").disabled = busy || !$("noema").value.trim();
        $("status").textContent = "";
        $("status").className = "";
      }
      function transcribe(text, native) {
        let quoted = false,
          escaped = false;
        return [...text]
          .map((c) => {
            if (quoted) {
              if (escaped) escaped = false;
              else if (c === "\\") escaped = true;
              else if (c === '"') quoted = false;
              return c;
            }
            if (c === '"') {
              quoted = true;
              return c;
            }
            const code = c.codePointAt(0), oldIndex = code - 0xe000, newIndex = code - 0xe100;
            const scriptIndex = newIndex >= 0 && newIndex < 32 ? newIndex : oldIndex;
            const index = native && !(scriptIndex >= 0 && scriptIndex < 32) ? alphabet.indexOf(c) : scriptIndex;
            return index >= 0 && index < 32 ? (native ? String.fromCodePoint(0xe100 + index) : alphabet[index]) : c;
          })
          .join("");
      }
      for (const id of ["natural", "noema"]) $(id).oninput = update;
      $("language").onchange = () => {
        $("natural").placeholder =
          $("language").value === "ja" ? "例：犬が猫を追う" : "Example: The dog chases the cat.";
        update();
      };
      $("script").onchange = () => {
        $("noema").value = transcribe($("noema").value, $("script").value === "native");
        update();
      };
      async function translate(direction) {
        const start = revision,
          language = $("language").value,
          source = direction === "to_noema" ? "natural" : "noema",
          target = direction === "to_noema" ? "noema" : "natural";
        busy = true;
        $("forward").disabled = $("backward").disabled = true;
        $("status").className = "";
        $("status").textContent = "変換中…";
        try {
          const response = await fetch("/translate", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ direction, language, text: $(source).value }),
            }),
            result = await response.json();
          if (revision !== start) return;
          if (!response.ok) throw new Error(result.error);
          if (result.status === "confirmed") {
            $(target).value =
              direction === "to_noema" && $("script").value === "proxy" ? result.canonical : result.text;
            revision++;
          } else $("status").className = "error";
          $("status").textContent = result.message;
        } catch (e) {
          if (revision === start) {
            $("status").className = "error";
            $("status").textContent = "変換できませんでした: " + e.message;
          }
        } finally {
          busy = false;
          $("forward").disabled = !$("natural").value.trim();
          $("backward").disabled = !$("noema").value.trim();
        }
      }
      $("forward").onclick = () => translate("to_noema");
      $("backward").onclick = () => translate("from_noema");
    </script>
  </body>
</html>
