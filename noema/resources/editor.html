<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Noema — 書く・読む</title>
<link rel="icon" href="data:,">
<style>
@font-face{font-family:Noema;src:url('/font.ttf')}*{box-sizing:border-box}body{margin:0;background:#f7f5ee;color:#233c3c;font:16px/1.6 system-ui,sans-serif}header,main{max-width:1300px;margin:auto;padding:24px}header{display:flex;align-items:baseline;gap:24px;border-bottom:1px solid #d2d8cc}h1{font:400 32px Georgia,serif;margin:0}h2{font-size:16px;margin:0 0 12px}.muted{color:#61746f;font-size:14px}main{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:24px}.card{padding:24px;background:#fffef9;border:1px solid #dce1d5;border-radius:8px}.wide{grid-column:1/-1}textarea{width:100%;min-height:260px;resize:vertical;background:#fbfaf6;border:1px solid #bbc9bf;border-radius:4px;padding:16px;font:18px/1.7 Noema,ui-monospace,monospace;color:#233c3c}button,input{font:inherit}button{cursor:pointer;border:1px solid #c2cdbf;border-radius:4px;padding:8px 14px;background:#eef2e9;color:#233c3c}button.primary{background:#275b50;color:white;border-color:#275b50}button:disabled{opacity:.45;cursor:default}button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid #b98c39;outline-offset:2px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.status{min-height:28px;color:#275b50}.error{color:#a33b28}.glyphs{display:flex;gap:5px;flex-wrap:wrap}.glyphs button{font:24px Noema,sans-serif;min-width:36px;padding:5px}.glyphs small{display:block;font:10px system-ui}.native{font:27px/1.8 Noema,system-ui;white-space:pre-wrap;overflow-wrap:anywhere}pre{white-space:pre-wrap;overflow-wrap:anywhere;font-size:13px;max-height:360px;overflow:auto}.dictionary{max-height:330px;overflow:auto;margin-top:12px}.word{display:grid;grid-template-columns:60px 1fr;gap:12px;padding:10px 0;border-bottom:1px solid #eee}.word button{font:17px Noema,monospace}.word small{display:block;color:#61746f}input[type=search]{width:100%;border:1px solid #bbc9bf;padding:10px;border-radius:4px}details{margin-top:14px}summary{cursor:pointer}a{color:#275b50}#result:empty:before{content:'文章を検査すると、固有文字で表示されます。';color:#61746f;font:16px system-ui}@media(max-width:780px){main{grid-template-columns:1fr}header{display:block}.card{padding:16px}}
</style></head><body>
<header><h1>Noema</h1><span>書く・読む</span><span class="muted">文語 0.3 · ローカル編集</span></header>
<main>
<section class="card"><h2><label for="source">文章</label></h2><p class="muted">代用文字と固有文字のどちらでも入力できます。名前は引用符で囲みます。</p>
<textarea id="source" spellcheck="false">noema c c
s vae i qo n "Aki" o aki z tp 2 lac o school.
s vac i p aki j jx o book l p school.
b vac i c j p book.</textarea>
<div class="actions"><button class="primary" id="check">検査する</button><button id="normalize" disabled>正規形にする</button><button id="native" disabled>固有文字にする</button><button id="open">文章を開く</button><button id="restore" disabled>開く前に戻す</button><button id="save">文章を保存</button><input id="file" type="file" accept=".noema,.txt,text/plain" hidden></div>
<div role="status" aria-live="polite" id="status" class="status"></div>
<details><summary>32文字を入力する</summary><div class="glyphs" id="alphabet"></div></details>
<details><summary>文の組み立て</summary><p>述語の後に役割と対象を書き、<code>.</code> で終えます。<code>i</code> 主体、<code>j</code> 対象、<code>k</code> 受け手、<code>l</code> 場所、<code>z</code> 出発地、<code>2</code> 到着地、<code>3</code> 道具、<code>4</code> 受益者。</p><p><code>u [ … ]</code> 否定、<code>b</code> 質問、<code>d</code> 依頼。<code>o aki</code> で対象に参照名を付け、<code>p aki</code> で再び指します。参照名は自由に選べます。</p></details>
</section>
<section class="card"><h2>固有文字の表示</h2><div id="result" class="native"></div><div class="actions"><button id="saveSvg" disabled>SVGを保存</button><button id="saveJson" disabled>意味を保存</button></div><details><summary>代用文字の正規形</summary><pre id="canonical"></pre></details><details><summary>意味構造</summary><pre id="meaning"></pre></details></section>
<section class="card wide"><h2><label for="search">語を探す</label></h2><input id="search" type="search" placeholder="日本語・英語・代用文字で検索"><p class="muted">語のボタンを押すと、入力位置に挿入します。文法的に正しい文でも、事実として正しいことを保証するものではありません。</p><div id="dictionary" class="dictionary"></div></section>
</main>
<script>
const $=id=>document.getElementById(id), source=$('source'); let inspected=null, words=[], revision=0, previous=null, filename='document.noema';
function invalidate(){revision++;inspected=null;for(const id of ['normalize','native','saveSvg','saveJson'])$(id).disabled=true;$('status').textContent='編集内容は未検査です。';$('status').className='status';$('result').textContent='';$('canonical').textContent='';$('meaning').textContent=''}
function insert(text){source.setRangeText(text,source.selectionStart,source.selectionEnd,'end');source.focus();invalidate()}
source.addEventListener('input',invalidate);
for(const [i,c] of [...'abcdefghijklmnopqrstuvwxyz234567'].entries()){const b=document.createElement('button');b.textContent=String.fromCharCode(0xE000+i);b.title=c;b.setAttribute('aria-label',`文字 ${c}`);const s=document.createElement('small');s.textContent=c;b.append(s);b.onclick=()=>insert(String.fromCharCode(0xE000+i));$('alphabet').append(b)}
function download(text,name,type){const url=URL.createObjectURL(new Blob([text],{type})),a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
$('save').onclick=()=>download(source.value,filename,'text/plain;charset=utf-8');
$('open').onclick=()=>$('file').click();
$('file').onchange=async()=>{const file=$('file').files[0];$('file').value='';if(!file)return;const started=revision;$('open').disabled=true;try{if(file.size>65536)throw new Error('64 KiB以下の文章を選んでください。');let text;try{text=new TextDecoder('utf-8',{fatal:true}).decode(await file.arrayBuffer())}catch{throw new Error('UTF-8の文章を選んでください。')}if(revision!==started)throw new Error('読込み中に編集されたため、文章を置き換えませんでした。');previous={text:source.value,filename};source.value=text;filename=file.name;invalidate();$('restore').disabled=false;$('status').textContent=file.name+' を開きました。内容を検査してください。';source.focus()}catch(e){$('status').textContent=e.message;$('status').className='status error'}finally{$('open').disabled=false}};
$('restore').onclick=()=>{source.value=previous.text;filename=previous.filename;previous=null;invalidate();$('restore').disabled=true;source.focus()};
$('check').onclick=async()=>{const text=source.value,started=revision;$('check').disabled=true;$('status').textContent='検査中…';try{const response=await fetch('/inspect',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text})}),data=await response.json();if(revision!==started)return;if(!response.ok)throw new Error(data.error);inspected=data;$('result').textContent=data.script;$('canonical').textContent=data.canonical;$('meaning').textContent=JSON.stringify(data.graph,null,2);$('status').textContent=`検査済み · 文語 ${data.graph.schema_version} · 意味構造を保存できます。`;$('status').className='status';for(const id of ['normalize','native','saveSvg','saveJson'])$(id).disabled=false}catch(e){if(revision===started){invalidate();$('status').textContent='文を確認してください: '+e.message;$('status').className='status error'}}finally{$('check').disabled=false}};
$('normalize').onclick=()=>{source.value=inspected.canonical;revision++};$('native').onclick=()=>{source.value=inspected.script;revision++};
$('saveSvg').onclick=()=>download(inspected.svg,'document.svg','image/svg+xml');$('saveJson').onclick=()=>download(JSON.stringify(inspected.graph,null,2),'meaning.json','application/json');
function drawDictionary(){const query=$('search').value.toLowerCase();$('dictionary').replaceChildren();for(const w of words.filter(w=>[w.word,w.ja,w.label,w.definition].some(x=>(x||'').toLowerCase().includes(query)))){const row=document.createElement('div');row.className='word';const button=document.createElement('button');button.textContent=w.word;button.onclick=()=>insert(' '+w.word+' ');const info=document.createElement('div');info.textContent=(w.ja||w.label)+' · '+w.label;const detail=document.createElement('small');detail.textContent=w.definition+(w.roles?' Roles: '+w.roles.join(', '):'');info.append(detail);row.append(button,info);$('dictionary').append(row)}}
$('search').oninput=drawDictionary;fetch('/lexicon').then(r=>r.json()).then(data=>{words=data.words;drawDictionary()}).catch(()=>{$('dictionary').textContent='語彙を読み込めませんでした。'});
</script></body></html>
